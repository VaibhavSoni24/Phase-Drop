name: Phase Drop CI/CD & Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup NSIS
        uses: nsis-dev/setup-nsis@99783963764acafc24a5e3335ddfce26d03c20a2 # v1.2.1
        with:
          version: 'latest'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1

      - name: Restore Dependencies
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore PhaseDrop.sln

      - name: Build Solution (Release)
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/build.ps1 -Configuration Release

      - name: Run Test Suite
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/test.ps1 -Configuration Release

      - name: Extract Release Version
        id: get_version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+.*)$') {
            $ver = $matches[1]
          } else {
            $ver = "1.0.0"
          }
          Write-Host "Configured package version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package Windows Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/package.ps1 -Configuration Release -Version "${{ steps.get_version.outputs.version }}"

      - name: Validate Release Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/validate-release.ps1 -Version "${{ steps.get_version.outputs.version }}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: PhaseDrop-Windows-Installer
          path: |
            dist/PhaseDrop-Setup-*.exe
            dist/PhaseDrop-Setup-*.exe.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Built Installer
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: PhaseDrop-Windows-Installer
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

name: Phase Drop CI/CD & Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup NSIS
        uses: nsis-dev/setup-nsis@v1
        with:
          version: 'latest'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Restore Dependencies
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore PhaseDrop.sln

      - name: Build Solution (Release)
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/build.ps1 -Configuration Release

      - name: Run Test Suite
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/test.ps1 -Configuration Release

      - name: Extract Release Version
        id: get_version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+.*)$') {
            $ver = $matches[1]
          } else {
            $ver = "1.0.0"
          }
          Write-Host "Configured package version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package Windows Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/package.ps1 -Configuration Release -Version "${{ steps.get_version.outputs.version }}"

      - name: Validate Release Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -File scripts/validate-release.ps1 -Version "${{ steps.get_version.outputs.version }}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhaseDrop-Windows-Installer
          path: |
            dist/PhaseDrop-Setup-*.exe
            dist/PhaseDrop-Setup-*.exe.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Installer
        uses: actions/download-artifact@v4
        with:
          name: PhaseDrop-Windows-Installer
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

name: Phase Drop CI/CD & Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress

      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y --no-progress

      - name: Restore Dependencies
        run: |
          dotnet restore PhaseDrop.sln

      - name: Build Solution (Release)
        run: |
          powershell -File scripts/build.ps1 -Configuration Release

      - name: Run Test Suite
        run: |
          powershell -File scripts/test.ps1 -Configuration Release

      - name: Package Windows Installer
        run: |
          powershell -File scripts/package.ps1 -Configuration Release -Version "1.0.0"

      - name: Validate Release Package
        run: |
          powershell -File scripts/validate-release.ps1 -Version "1.0.0"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhaseDrop-Windows-Installer
          path: |
            dist/PhaseDrop-Setup-*.exe
            dist/PhaseDrop-Setup-*.exe.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Installer
        uses: actions/download-artifact@v4
        with:
          name: PhaseDrop-Windows-Installer
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
